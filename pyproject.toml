[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sausero"
version = "1.2.6"
authors = [
    {name = "Fabricio M. Pérez-Toledo", email = "fabricio.perez@gtc.iac.es"},
]
description = "This software is designed to reduce OSIRIS+ observations."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

dependencies = [
    "astroalign",
    "astrometry_net_client",
    "astropy",
    "astroquery",
    "ccdproc",
    "lacosmic",
    "loguru",
    "matplotlib",
    "numpy",
    "PyYAML",
    "sep",
    "sphinx",
    "sphinx-rtd-theme"
]

[project.urls]
Homepage = "https://github.com/Kennicutt/SAUSERO"
"Bug Tracker" = "https://github.com/Kennicutt/SAUSERO/issues"

# ========== CONSOLE SCRIPT ==========
[project.scripts]
sausero = "sausero.OsirisDRP:run"

# ========== PACKAGE DATA ==========
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
sausero = [
    "config/configuration.json",
    "config/photometric_standards.json",
    "BPM/BPM_OSIRIS_PLUS.fits"
]

# ========== FIND PACKAGES ==========
[tool.setuptools.packages.find]
where = ["."]   # same as packages=find_packages(where='.')
include = ["sausero*"]